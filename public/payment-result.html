<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حالة الدفع | Attractive</title><style>body{margin:0;background:#f5f5f7;color:#202124;font-family:system-ui,Arial;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:36px;border-radius:24px;box-shadow:0 18px 50px #0001;text-align:center;max-width:520px;margin:20px}h1{color:#c81035}p{line-height:1.8}.btn{display:inline-block;background:#c81035;color:white;text-decoration:none;padding:12px 24px;border-radius:30px;margin-top:18px}</style><link rel="stylesheet" href="/theme.css"><script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem("attractive-theme-mode")==="dark"?"dark":"light"}catch(e){}})();</script><script src="/theme.js" defer></script></head><body><main class="card"><h1 id="title">نتحقق من حالة الدفع</h1><p id="message">لحظات من فضلك… سيتم تأكيد النتيجة من نظام الدفع.</p><a class="btn" href="/">العودة للمتجر</a></main><script>
const q=new URLSearchParams(location.search),id=q.get('orderId');let phone=sessionStorage.getItem('paymob:'+id)||'',attempts=0;const title=document.getElementById('title'),message=document.getElementById('message');function scheduleCheck(){attempts++;if(attempts>=40){message.textContent='لم يصل تأكيد الدفع بعد. راجع حالة الطلب من حسابك أو تواصل معنا برقم الطلب.';return}setTimeout(check,Math.min(12000,2500+attempts*300))}async function check(){if(!id||!phone){message.textContent='تعذر التحقق من الطلب. ارجع للمتجر أو تواصل معنا مع رقم الطلب.';return}try{const r=await fetch('/api/paymob-status?orderId='+encodeURIComponent(id)+'&phone='+encodeURIComponent(phone),{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(d.status==='paid'||d.status==='deposit_paid'){title.textContent='تم تأكيد الدفع';message.textContent='تم استلام الدفع بنجاح للطلب '+id+'.'}else if(d.status==='failed'){title.textContent='لم يكتمل الدفع';message.textContent='لم يتم تأكيد الدفع. يمكنك الرجوع للمتجر والمحاولة مرة أخرى.'}else if(d.status==='refunded'){title.textContent='تم رد المبلغ';message.textContent='تم تسجيل رد المبلغ للطلب '+id+'.'}else{scheduleCheck()}}catch{message.textContent='جارٍ انتظار تأكيد الدفع من الخادم…';scheduleCheck()}}check();
</script></body></html>
